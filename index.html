<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Urna Eletrônica - Governo do RJ</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://www.gstatic.com/datastudio/visualization/v1/dscc.min.js"></script>
</head>
<body>

<div class="app-container">

  <!-- URNA (Fundo #edeeec) -->
  <div class="urna-box">
    <div class="urna-header">
      <div class="urna-sub">Pesquisa eleitoral - Simulador de votação</div>
      <div class="urna-cargo">Governador do Estado do RJ</div>
    </div>

    <div class="urna-corpo">
      <!-- TELA -->
      <div class="tela-box">
        <img id="foto-candidato" class="foto-candidato" src="" alt="Foto Candidato">
        
        <div id="tela-conteudo" class="tela-overlay">
          <div>
            <div class="tela-label">GOVERNADOR DO RJ</div>
            <div class="numero-display">
              <div id="d1" class="digito-box"></div>
              <div id="d2" class="digito-box"></div>
            </div>
          </div>

          <div>
            <div id="cand-nome" class="candidato-nome"></div>
            <div id="cand-partido" class="candidato-partido"></div>
          </div>
        </div>

        <div id="tela-fim" class="tela-fim">FIM</div>
      </div>

      <!-- TECLADO -->
      <div class="teclado-box">
        <div class="teclado-grid">
          <button class="btn-tecla" onclick="inserirNumero('1')">1</button>
          <button class="btn-tecla" onclick="inserirNumero('2')">2</button>
          <button class="btn-tecla" onclick="inserirNumero('3')">3</button>
          <button class="btn-tecla" onclick="inserirNumero('4')">4</button>
          <button class="btn-tecla" onclick="inserirNumero('5')">5</button>
          <button class="btn-tecla" onclick="inserirNumero('6')">6</button>
          <button class="btn-tecla" onclick="inserirNumero('7')">7</button>
          <button class="btn-tecla" onclick="inserirNumero('8')">8</button>
          <button class="btn-tecla" onclick="inserirNumero('9')">9</button>
          <button class="btn-tecla btn-zero" onclick="inserirNumero('0')">0</button>
        </div>

        <div class="btn-acoes">
          <button class="btn-acao btn-branco" onclick="votarBranco()">BRANCO</button>
          <button class="btn-acao btn-corrige" onclick="corrige()">CORRIGE</button>
          <button class="btn-acao btn-confirma" onclick="confirma()">CONFIRMA</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LISTA LATERAL (Fundo #141414) -->
  <div class="lista-box">
    <div class="lista-titulo">Lista de candidatos e partidos</div>
    <div id="lista-candidatos" class="candidatos-scroll">
      <!-- Inseridos via JavaScript -->
    </div>
  </div>

</div>

<script src="index.js"></script>
</body>
</html>
